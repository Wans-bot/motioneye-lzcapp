version: 1

project:
  root: .
  build_config: lzc-build.yml
  package_file: package.yml
  output: out/motioneye.lpk
  target_arch: amd64

update:
  strategy: publish
  allow_downgrade: false
  version_source:
    type: image
    image: motioneye

build:
  run_buildscript: false

images:
  - id: motioneye
    target: service
    service: motioneye
    source: ghcr.io/motioneye-project/motioneye
    channel: stable
    tag_regex: '^\d+\.\d+\.\d+$'
    sort: semver
    delivery:
      mode: lazycat

stores:
  official:
    enabled: true
  private:
    enabled: false
